<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Andre & Anisa</title>
    <style>
        /* Desain Background Berlapis */
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 0;
            /* Latar belakang dasar: kertas krem bertekstur */
            background-color: #e5e0d3;
            background-image: 
                /* Lengkungan marun beludru (posisi bawah) */
                linear-gradient(135deg, transparent 65%, #3d1b1f 65%),
                linear-gradient(-135deg, transparent 65%, #3d1b1f 65%),
                /* Lengkungan marun beludru (posisi atas) */
                linear-gradient(135deg, #3d1b1f 35%, transparent 35%),
                linear-gradient(-135deg, #3d1b1f 35%, transparent 35%);
            background-size: 100% 100%;
            background-position: bottom, bottom, top, top;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1a1411;
            text-align: center;
            position: relative;
        }

        /* Ornamen Bunga Pertas & Emas (Simulasi) */
        /* Menggunakan simbol teks karena kita tidak pakai file gambar */
        body::before {
            content: "✿ ✦ ✿";
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: #d4af37; /* Warna Emas */
            text-shadow: -2px 0 #fff, 0 2px #fff, 2px 0 #fff, 0 -2px #fff; /* Outline putih */
            z-index: 5;
        }
