<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Andre & Syafira</title>
    <style>
        /* Gaya Dasar & Font Klasik */
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #dfd7ca; /* Warna kertas krem */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Container Utama */
        .invitation-wrapper {
            max-width: 450px;
            width: 100%;
            background-color: #dfd7ca;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative; /* Penting untuk posisi bunga */
        }

        /* --- 1. HALAMAN PEMBUKA / COVER (Bagian Atas yang Dilingkari Merah) --- */
        .section-cover {
            background-color: #3d1116; /* Warna Marun Beludru Mewah */
            padding: 60px 25px 80px 25px;
            color: #ffffff;
            text-align: center;
            border-bottom: 5px solid #d4af37; /* Garis pembatas emas */
            position: relative;
        }

        .main-title {
            font-size: 13px;
            letter-spacing: 3px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .cover-names {
            font-size: 38px;
            font-family: 'Georgia', serif;
            color: #ffffff;
            margin: 20px 0;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .cover-names span {
            display: block;
            font-size: 26px;
            color: #d4af37;
            margin: 10px 0;
        }

        /* Kotak Tempat Nama Tamu */
        .box-tamu {
            background: #ffffff;
            border: 3px double #d4af37;
            border-radius: 12px;
            padding: 20px 10px;
            margin: 40px auto 20px auto;
            max-width: 85%;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .yth-tamu {
            font-size: 11px;
            color: #666666;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #namaTamu {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
            margin: 0;
            text-transform: uppercase;
        }
        .label-bawah-tamu {
            font-size: 11px;
            color: #666666;
            margin: 8px 0 0 0;
            font-style: italic;
        }

        /* Hint Scroll Down */
        .scroll-hint {
            font-size: 12px;
            color: #dfd7ca;
            opacity: 0.6;
            margin-top: 30px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* --- ORNAMEN BUNGA (Bagian Kiri Bawah Cover yang Dilingkari Hitam) --- */
        .flower-ornament {
            position: absolute;
            left: -20px; /* Sedikit keluar dari container */
            bottom: -50px; /* Menutupi perbatasan marun-krem */
            width: 150px;
            height: 150px;
            background-image: url('bunga.png'); /* File bunga harus ada di folder */
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }

        /* --- 2. HALAMAN ISI (Bagian Bawah Setelah di-Scroll) --- */
        .section-content {
            padding: 100px 25px 40px 25px; /* Padding atas lebih besar untuk memberi ruang bunga */
            text-align: center;
            color: #26070a;
            flex-grow: 1;
        }

        .tanggal-atas {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #b38f2d;
            margin-bottom: 25px;
        }

        .ayat {
            font-style: italic;
            font-size: 13.5px;
            line-height: 1.6;
            color: #554441;
            margin: 0 10px 30px 10px;
            padding-bottom: 20px;
            border-bottom: 1px dashed rgba(66, 17, 23, 0.2);
        }

        .mempelai-box {
            margin: 25px 0;
