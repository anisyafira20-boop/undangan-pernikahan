<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Andre & Syafira</title>
    <style>
        /* Gaya Dasar & Font Klasik */
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #dfd7ca; /* Warna kertas krem sesuai gambar */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Efek Animasi Kelopak Bunga Gugur Sisi Layar */
        .flower-drop {
            position: fixed;
            width: 18px;
            height: 18px;
            background: #fbf9f3;
            border: 1px solid #d4af37;
            border-radius: 20px 0 20px 0;
            box-shadow: inset 0 0 5px rgba(212,175,55,0.3);
            animation: fall 8s infinite linear;
            opacity: 0.7;
            pointer-events: none;
            z-index: 99;
        }
        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg); left: calc(5% + 90% * var(--x)); }
            100% { transform: translateY(105vh) rotate(360deg); left: calc(5% + 90% * var(--x) + 40px); }
        }

        /* Container Utama Dibuat Panjang Kebawah */
        .invitation-wrapper {
            max-width: 450px;
            width: 100%;
            background-color: #dfd7ca;
            box-shadow: 0 0 30px rgba(0,0,0,0.15);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 1. HALAMAN PEMBUKA / COVER (Bagian Atas) --- */
        .section-cover {
            background: linear-gradient(180deg, #421117 0%, #26070a 100%);
            border-radius: 0 0 220px 220px;
            padding: 60px 25px 80px 25px;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
        }

        .main-title {
            font-size: 13px;
            letter-spacing: 3px;
            color: #d4af37;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .cover-names {
            font-size: 38px;
            font-family: 'Georgia', serif;
            color: #ffffff;
            margin: 20px 0;
            line-height: 1.2;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .cover-names span {
            display: block;
            font-size: 26px;
            color: #d4af37;
            margin: 10px 0;
        }

        /* Kotak Tempat Nama Tamu di Bagian Pembuka */
        .box-tamu {
            background: #ffffff;
            border: 3px double #d4af37;
            border-radius: 12px;
            padding: 18px 10px;
            margin: 40px auto 20px auto;
            max-width: 85%;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .yth-tamu {
            font-size: 11px;
            color: #666666;
            margin: 0 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #namaTamu {
            font-size: 22px;
            font-weight: bold;
            color: #111111;
            margin: 0;
            text-transform: uppercase;
        }
        .label-bawah-tamu {
            font-size: 11px;
            color: #666666;
            margin: 6px 0 0 0;
            font-style: italic;
        }

        /* Hint Scroll Down */
        .scroll-hint {
            font-size: 12px;
            color: #dfd7ca;
            opacity: 0.6;
            margin-top: 30px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* --- 2. HALAMAN ISI (Bagian Bawah Setelah di-Scroll) --- */
        .section-content {
            padding: 60px 25px 40px 25px;
            text-align: center;
            color: #26070a;
            flex-grow: 1;
        }

        .tanggal-atas {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #b38f2d;
            margin-bottom: 25px;
        }

        .ayat {
            font-style: italic;
            font-size: 13.5px;
            line-height: 1.6;
            color: #554441;
            margin: 0 10px 30px 10px;
            padding-bottom: 20px;
            border-bottom: 1px dashed rgba(66, 17, 23, 0.2);
        }

        .pengantar {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 35px;
            color: #26070a;
        }

        /* Detail Nama Lengkap Pengantin */
        .mempelai-box {
            margin: 25px 0;
        }
        .nama-lengkap {
            font-size: 22px;
            font-weight: bold;
            color: #421117;
            margin-bottom: 4px;
        }
        .nama-china {
            font-size: 15px;
            color: #b38f2d;
            margin-bottom: 6px;
            letter-spacing: 1px;
            font-weight: bold;
        }
        .orang-tua {
            font-size: 12.5px;
            color: #554441;
        }
        .simbol-dan-isi {
            font-size: 32px;
            color: #b38f2d;
            font-family: 'Georgia', serif;
            margin: 20px 0;
        }

        /* --- 3. KOTAK ACARA DAN LOKASI (Bagian Paling Bawah) --- */
        .section-event {
            background: linear-gradient(180deg, #26070a 0%, #421117 100%);
            border-radius: 220px 220px 0 0;
            padding: 50px 25px 60px 25px;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        .flower-deco {
            font-size: 26px;
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212,175,55,0.5);
            margin-bottom: 15px;
        }

        .waktu-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: #dfd7ca;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Grid Waktu & Lokasi */
        .grid-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 25px 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px 0;
            font-size: 13.5px;
        }
        .grid-item h4 {
            margin: 0 0 5px 0;
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .grid-item p {
            margin: 0;
            line-height: 1.4;
            color: #f0e6df;
        }
        .lokasi-full {
            grid-column: span 2;
        }
        .lokasi-full p strong {
            color: #ffffff;
            font-size: 15px;
        }
        .alamat-jalan {
            font-size: 12.5px;
            color: #dcd0c7;
            margin-top: 4px !important;
        }

            line-height: 1.6;
            color: #dcd0c7;
            padding: 0 10px;
            margin-top: 30
